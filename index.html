<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>converter</title>
    </head>
    <body>
        <main>
            <section class="converter">
                <div class="container">
                    <h1 class="converter__heading">Конвертер валют</h1>
                    <form class="converter__form form" action="#">
                        <div class="form__wrapper">
                            <fieldset class="form__fieldset">
                                <label class="form__label" for="selectInToggle">У меня имеется</label>
                                <!--<select class="form__select" name="selectIn" id="selectIn">
                                    <option value="">Выберите валюту</option>
                                </select> -->

                                <div class="form__select" id="selectIn">
                                    <button
                                        type="button"
                                        class="form__select-toggle"
                                        id="selectInToggle"
                                        aria-expanded="false"
                                    >
                                        Выберите валюту
                                    </button>
                                    <ul
                                        class="form__select-menu"
                                        role="listbox"
                                        aria-hidden="true"
                                        name="selectIn"
                                        id="selectInList"
                                    ></ul>
                                    <input type="hidden" id="selectInValue">
                                </div>

                                <input
                                    class="form__input"
                                    type="number"
                                    step="0.0001"
                                    name="inputIn"
                                    id="inputIn"
                                    placeholder="0"
                                >
                            </fieldset>
                            <fieldset class="form__fieldset">
                                <label class="form__label" for="selectOutToggle">Хочу приобрести</label>
                                <!--<select class="form__select" name="selectOut" id="selectOut">
                                    <option value="0">Выберите валюту</option>
                                </select>-->

                                <div class="form__select" id="selectOut">
                                    <button
                                        type="button"
                                        class="form__select-toggle"
                                        id="selectOutToggle"
                                        aria-expanded="false"
                                    >
                                        Выберите валюту
                                    </button>
                                    <ul
                                        class="form__select-menu form__select-menu--right"
                                        role="listbox"
                                        aria-hidden="true"
                                        name="selectIn"
                                        id="selectOutList"
                                    ></ul>
                                    <input type="hidden" id="selectOutValue">
                                </div>
                                <input
                                    class="form__input"
                                    type="number"
                                    name="inputOut"
                                    id="inputOut"
                                    placeholder="0"
                                    disabled
                                >
                            </fieldset>
                            <button class="form__button" id="refreshBtn">
                                <svg class="form__button-icon" width="50" height="55">
                                    <use href="/__spritemap#sprite-icon-arrows"></use>
                                </svg>
                            </button>
                        </div>
                    </form>
                </div>
            </section>
            <section class="currency">
                <div class="container">
                    <h2 class="currency__heading">Курсы валют на <span class="currency__date"></span></h2>
                    <div class="currency__wrapper">
                        <table class="currency__table table">
                            <thead class="table__header">
                                <tr class="table__tr">
                                    <th class="table__th">Код</th>
                                    <th class="table__th">Единица</th>
                                    <th class="table__th">Валюта</th>
                                    <th class="table__th">Курс базовой валюты</th>
                                </tr>
                            </thead>
                            <tbody class="table__body" id="tableBody"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
